name: Feature request
description: Suggest an improvement to Creative Pressure
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: behaviour
    attributes:
      label: Requested behaviour
    validations:
      required: true

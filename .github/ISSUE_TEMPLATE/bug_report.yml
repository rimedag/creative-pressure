name: Bug report
description: Something in Creative Pressure does not work as expected
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Creative Pressure version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11 23H2
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Choose a 30m session with Train Rain
        2. Start the timer
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or additional context
      description: Please do not include private session notes you do not want to share.
